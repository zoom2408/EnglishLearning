<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>12 thì · Ngữ pháp tiếng Anh</title>
  <meta name="description" content="Tenses: Trục thời gian, cấu trúc, dấu hiệu, văn nói và văn viết. Lý thuyết trực quan, luyện tập và trò chơi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/practice.css">
  <link rel="stylesheet" href="assets/css/finder.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <script>try{var t=localStorage.getItem("theme12");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-module="tenses">
  <div class="wrap">
    <header class="site" id="site"></header>
    <main class="mod" id="mod-tenses">
    <header class="mast">
      <h1>12 thì<span>.</span></h1>
      <p class="intro">Một trục thời gian, mười hai cách đặt hành động lên đó. <b>Bấm vào một dòng</b> để mở sơ đồ, cấu trúc và cách dùng. Phím ↑ ↓ để đi giữa các thì.</p>
      <nav class="tabs" role="tablist">
        <button role="tab" data-view="learn" aria-selected="true">Lý thuyết</button>
        <button role="tab" data-view="quiz" aria-selected="false">Luyện tập</button>
        <button role="tab" data-view="find" aria-selected="false">Tra dấu hiệu</button>
        <i class="ink" aria-hidden="true"></i>
      </nav>
    </header>

    <section class="view learnv" id="view-learn">
      <div class="controls">
        <div class="seg" id="sort"><span class="lbl">Xếp theo</span>
          <button data-sort="time" aria-pressed="true">Thời gian</button>
          <button data-sort="aspect" aria-pressed="false">Thể</button>
        </div>
        <div class="seg" id="filter"><span class="lbl">Lọc</span>
          <button data-f="all" aria-pressed="true">Tất cả</button>
          <button data-f="past" aria-pressed="false">Quá khứ</button>
          <button data-f="present" aria-pressed="false">Hiện tại</button>
          <button data-f="future" aria-pressed="false">Tương lai</button>
        </div>
      </div>
      <div class="score">
        <div class="shead">
          <span class="lbl">Nº</span><span class="lbl">Thì</span>
          <div class="zones">
            <button class="zp" data-f="past">← Quá khứ</button>
            <span class="zn">Bây giờ</span>
            <button class="zf" data-f="future">Tương lai →</button>
          </div>
        </div>
        <div id="rows"></div>
      </div>
    </section>

    <section class="view" id="view-quiz" hidden><div class="quiz" id="quiz"></div></section>
    <section class="view" id="view-find" hidden>
      <div class="finder">
        <label class="lbl" for="q" style="margin-bottom:6px">Gặp từ này thì dùng thì nào?</label>
        <input class="search" id="q" type="search" placeholder="since, yesterday, by the time…" autocomplete="off">
        <div class="found" id="found"></div>
        <p class="hint">Một dấu hiệu có thể thuộc nhiều thì, ví dụ <b>for</b>, <b>since</b>, <b>when</b>. Hãy đọc cả câu để chọn đúng.</p>
        <div class="allsig"><span class="lbl">Tất cả dấu hiệu</span><div class="chips" id="allsignals"></div></div>
      </div>
    </section>
    </main>
  </div>
  <script src="content/modules.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="content/theory/tenses.js"></script>
  <script src="assets/js/core/nav.js"></script>
  <script src="assets/js/core/theme.js"></script>
  <script src="assets/js/core/diagrams.js"></script>
  <script src="assets/js/core/rows.js"></script>
  <script src="assets/js/core/practice.js"></script>
  <script src="content/quiz/tenses.js"></script>
  <script src="assets/js/pages/tenses.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
