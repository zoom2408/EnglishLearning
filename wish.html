<body data-module="wish">
  <div class="wrap">
    <header class="site" id="site"></header>
    <main class="mod" id="mod-wish">
    <header class="mast">
      <h1 class="long">Wish<span>.</span></h1>
      <p class="intro">Câu ước nói về điều <b>không có thật</b>, nên động từ lùi về quá khứ một bậc. Hình tròn nét đứt trên trục là điều ước, không phải thực tế.</p>
      <nav class="tabs" role="tablist">
        <button role="tab" data-view="learn" aria-selected="true">Lý thuyết</button>
        <button role="tab" data-view="quiz" aria-selected="false">Luyện tập</button>
        <i class="ink" aria-hidden="true"></i>
      </nav>
    </header>

    <section class="view learnv" id="view-learn">
      <div class="score" style="margin-top:22px">
        <div class="shead"><span class="lbl">Nº</span><span class="lbl">Cấu trúc</span><div class="zones"><span class="zl">← Quá khứ</span><span class="zn">Bây giờ</span><span class="zr">Tương lai →</span></div></div>
        <div id="rows"></div>
      </div>
    </section>

    <section class="view" id="view-quiz" hidden><div class="quiz" id="quiz"></div></section>
    </main>
  </div>
