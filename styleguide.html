<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <title>Design system</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/styleguide.css">
  <script>try{var t=localStorage.getItem("theme12");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-module="styleguide">
  <div class="sg-app">
    <header class="sg-top">
      <a class="sg-logo" href="/" aria-label="Về trang chủ">Học mọi thứ<b>.</b><span>Design system</span></a>
      <div class="sg-tools">
        <div class="sg-seg" id="sg-vp" role="group" aria-label="Độ rộng canvas">
          <button type="button" data-w="100%" aria-pressed="true">Desktop</button>
          <button type="button" data-w="768px" aria-pressed="false">Tablet</button>
          <button type="button" data-w="375px" aria-pressed="false">Mobile</button>
        </div>
        <div class="sg-seg" id="sg-bg" role="group" aria-label="Nền canvas">
          <button type="button" data-bg="var(--bg)" aria-pressed="true">Nền</button>
          <button type="button" data-bg="var(--surface)" aria-pressed="false">Surface</button>
        </div>
        <button id="themeBtn" class="theme" type="button" aria-label="Đổi giao diện sáng hoặc tối"><i></i><span>Tự động</span></button>
      </div>
    </header>

    <aside class="sg-side">
      <details class="sg-menu" id="sg-menu" open>
        <summary>Danh mục</summary>
        <label class="sg-search"><span class="lbl">Tìm</span><input class="input input--sm" id="sg-q" type="search" placeholder="Tên component"></label>
        <nav id="sg-nav" aria-label="Stories"></nav>
      </details>
    </aside>

    <main class="sg-main" id="sg-main">
      <div class="sg-head">
        <div>
          <p class="sg-crumb" id="sg-crumb"></p>
          <h1 id="sg-title"></h1>
          <p class="sg-desc" id="sg-desc"></p>
        </div>
        <div class="sg-tabs" id="sg-tabs" role="tablist" aria-label="Chế độ xem">
          <button type="button" role="tab" data-t="canvas" aria-selected="true">Canvas</button>
          <button type="button" role="tab" data-t="docs" aria-selected="false">Docs</button>
        </div>
      </div>

      <section class="sg-canvas" id="sg-canvas">
        <div class="sg-stage"><iframe id="sg-frame" title="Canvas" class="sg-frame"></iframe></div>
        <div class="sg-panel" id="sg-panel">
          <div class="sg-ptabs" role="tablist" aria-label="Bảng phụ">
            <button type="button" role="tab" data-p="controls" aria-selected="true">Controls</button>
            <button type="button" role="tab" data-p="code" aria-selected="false">Code</button>
            <button type="button" class="sg-reset" id="sg-reset">Đặt lại</button>
          </div>
          <div class="sg-pbody" id="sg-pbody"></div>
        </div>
      </section>

      <section class="sg-docs" id="sg-docs" hidden></section>
    </main>
  </div>
  <script src="assets/js/core/theme.js"></script>
  <script src="assets/js/styleguide.js"></script>
</body>
</html>
